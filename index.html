<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7bc7c7">
  <title>포근섬</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <canvas id="game" width="960" height="600" aria-label="포근섬 게임 화면"></canvas>

    <header class="hud glass">
      <div><span class="sun">☀</span><strong id="time">오전 8:20</strong></div>
      <div class="weather">맑음 · 산들바람</div>
    </header>

    <aside class="seed-pill glass" aria-live="polite">
      <span class="seed-icon">✦</span>
      <div><small>데이지 씨앗</small><strong id="seed-count">0</strong></div>
    </aside>

    <section id="welcome" class="welcome glass">
      <p>이 작은 섬은 이제 당신의 공간입니다.</p>
      <button id="begin">천천히 둘러보기</button>
    </section>

    <div id="toast" class="toast glass" aria-live="polite"></div>
    <div id="hint" class="hint glass"><kbd>WASD</kbd> 이동 · <kbd>Shift</kbd> 달리기 · <kbd>E</kbd> 행동</div>

    <nav class="touch-controls" aria-label="터치 조작">
      <div class="dpad">
        <button data-key="ArrowUp" aria-label="위">▲</button>
        <button data-key="ArrowLeft" aria-label="왼쪽">◀</button>
        <button data-key="ArrowDown" aria-label="아래">▼</button>
        <button data-key="ArrowRight" aria-label="오른쪽">▶</button>
      </div>
      <button id="action" class="action">E<small>행동</small></button>
    </nav>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
